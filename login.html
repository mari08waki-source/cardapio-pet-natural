  <style>
    :root {
      --sage:       #124016;
      --sage-light: #1A5C20;
      --gold:       #D4AF37;
      --gold-dark:  #B8962E;
      --white:      #FFFFFF;
      --bg:         #F8FAFB;
      --text:       #0F172A;
      --muted:      #64748B;
      --error:      #EF4444;
      --border:     #E2E8F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #F8FAFB 0%, #E2E8F0 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--white);
      width: 100%;
      max-width: 440px;
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
      padding: 48px;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--sage), var(--gold));
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 40px;
    }

    .brand-icon {
      width: 64px;
      height: 64px;
      background: var(--sage);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
      margin-bottom: 16px;
      box-shadow: 0 10px 20px rgba(18,64,22,0.2);
    }

    .brand-icon svg { width: 32px; height: 32px; }

    .brand-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--sage);
      letter-spacing: -0.5px;
    }

    .brand-sub {
      font-size: 14px;
      color: var(--muted);
      margin-top: 4px;
    }

    .field { margin-bottom: 24px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .field input {
      width: 100%;
      padding: 14px 18px;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      font-size: 16px;
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
      background: #F1F5F9;
    }

    .field input:focus {
      border-color: var(--sage);
      background: white;
      box-shadow: 0 0 0 4px rgba(18,64,22,0.08);
    }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: var(--sage);
      color: white;
      border: none;
      border-radius: 18px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 15px -3px rgba(18,64,22,0.3);
    }

    .btn-primary:hover {
      background: var(--sage-light);
      transform: translateY(-2px);
      box-shadow: 0 20px 25px -5px rgba(18,64,22,0.3);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 24px;
      display: none;
      font-weight: 500;
    }

    .alert.error {
      background: #FEF2F2;
      color: var(--error);
      border: 1px solid #FECACA;
      display: block;
    }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      margin-top: -16px;
      margin-bottom: 32px;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot-link:hover { color: var(--sage); }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 32px;
      background: #F1F5F9;
      padding: 6px;
      border-radius: 14px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .tab.active {
      background: white;
      color: var(--sage);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Micro-animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .login-card { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1); }

  </style>

  <div style="background:white;border-radius:20px;max-width:520px;margin:auto;padding:28px;position:relative;">

<script>
  // ── SUPABASE ──────────────────────────────────────────
  const { createClient } = supabase;
  const sb = createClient(
    'https://fzmqdevzdwluhasvxswi.supabase.co',
    'sb_publishable_FJ921pqk3-vg8gD68euDTg_H1TtAZdz'
  );

  // Admin email
  const ADMIN_EMAIL = 'mari08waki@gmail.com';

  // ── VERIFICAR SE JÁ ESTÁ LOGADO ──
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) redirectUser(session.user.email);
  })();

  function redirectUser(email) {
    if (email === ADMIN_EMAIL) {
      window.location.href = 'admin.html';
    } else {
      window.location.href = 'cardapio.html';
    }
  }

  // ── TABS ─────────────────────────────────────────────
  function showTab(tab) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

    if (tab === 'login') {
      document.getElementById('panelLogin').classList.add('active');
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('mainTabs').style.display = '';
    } else if (tab === 'cadastro') {
      document.getElementById('panelCadastro').classList.add('active');
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('mainTabs').style.display = '';
    }
  }

  function showForgot() {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panelForgot').classList.add('active');
    document.getElementById('mainTabs').style.display = 'none';
  }

  // ── TOGGLE SENHA ─────────────────────────────────────
  function togglePass(inputId, btn) {
    const input = document.getElementById(inputId);
    const isPass = input.type === 'password';
    input.type = isPass ? 'text' : 'password';
    btn.innerHTML = isPass
      ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
      : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
  }

  // ── FORÇA DA SENHA ────────────────────────────────────
  function checkStrength(val) {
    let score = 0;
    if (val.length >= 8) score++;
    if (/[A-Z]/.test(val)) score++;
    if (/[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val)) score++;

    const colors = ['#EF4444','#F97316','#EAB308','#22C55E'];
    const labels = ['Fraca','Média','Boa','Forte 💪'];
    for (let i = 1; i <= 4; i++) {
      const seg = document.getElementById('s' + i);
      seg.style.background = i <= score ? colors[score - 1] : 'var(--border)';
    }
    document.getElementById('strengthLabel').textContent = val.length > 0 ? labels[score - 1] || '' : '';
  }

  // ── ALERTA ────────────────────────────────────────────
  function showAlert(id, type, msg) {
    const el = document.getElementById(id);
    const icon = type === 'error'
      ? `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`
      : `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`;
    el.className = `alert show ${type}`;
    el.innerHTML = icon + msg;
  }

  function hideAlert(id) {
    document.getElementById(id).className = 'alert';
  }

  // ── LOGIN ─────────────────────────────────────────────
  async function handleLogin() {
    hideAlert('alertLogin');
    const email = document.getElementById('loginEmail').value.trim();
    const senha = document.getElementById('loginSenha').value;

    if (!email || !senha) {
      showAlert('alertLogin', 'error', 'Preencha e-mail e senha.');
      return;
    }

    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.textContent = 'Entrando...';
    btn.classList.add('loading');

    const { data, error } = await sb.auth.signInWithPassword({ email, password: senha });

    if (error) {
      btn.disabled = false;
      btn.textContent = 'Entrar na minha conta';
      btn.classList.remove('loading');
      const msgs = {
        'Invalid login credentials': 'E-mail ou senha incorretos.',
        'Email not confirmed': 'Confirme seu e-mail antes de entrar. Verifique sua caixa de entrada.',
        'Too many requests': 'Muitas tentativas. Aguarde alguns minutos.',
      };
      showAlert('alertLogin', 'error', msgs[error.message] || 'Erro ao entrar. Tente novamente.');
      return;
    }

    redirectUser(data.user.email);
  }

  // ── CADASTRO ──────────────────────────────────────────
  async function handleCadastro() {
    hideAlert('alertCadastro');
    const nome    = document.getElementById('cadNome').value.trim();
    const email   = document.getElementById('cadEmail').value.trim();
    const senha   = document.getElementById('cadSenha').value;
    const confirma= document.getElementById('cadConfirma').value;
    const termos  = document.getElementById('termos').checked;

    if (!nome || !email || !senha || !confirma) {
      showAlert('alertCadastro', 'error', 'Preencha todos os campos.');
      return;
    }
    if (senha !== confirma) {
      showAlert('alertCadastro', 'error', 'As senhas não coincidem.');
      return;
    }
    if (senha.length < 8) {
      showAlert('alertCadastro', 'error', 'A senha deve ter pelo menos 8 caracteres.');
      return;
    }
    if (!termos) {
      showAlert('alertCadastro', 'error', 'Aceite os Termos de Uso para continuar.');
      return;
    }

    const btn = document.getElementById('btnCadastro');
    btn.disabled = true;
    btn.textContent = 'Criando conta...';
    btn.classList.add('loading');

    const { data, error } = await sb.auth.signUp({
      email,
      password: senha,
      options: {
        data: { full_name: nome },
        emailRedirectTo: window.location.origin + '/login.html'
    // Detector de Admin para mostrar botão de emergência
    document.getElementById('loginEmail').addEventListener('input', (e) => {
      const area = document.getElementById('magicLinkArea');
      if (e.target.value.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
        area.style.display = 'block';
      } else {
        area.style.display = 'none';
      }
    });

    async function handleMagicLink() {
      const email = document.getElementById('loginEmail').value;
      const alert = document.getElementById('authAlert');
      alert.style.display = 'none';

      try {
        const { error } = await sb.auth.signInWithOtp({
          email: email,
          options: {
            emailRedirectTo: window.location.origin + '/admin'
          }
        });
        if (error) throw error;
        alert.style.display = 'block';
        alert.className = 'alert error';
        alert.style.color = '#16A34A';
        alert.style.backgroundColor = '#F0FDF4';
        alert.textContent = 'Link enviado! Verifique seu e-mail para entrar direto no Admin.';
      } catch (err) {
        alert.style.display = 'block';
        alert.className = 'alert error';
        alert.textContent = err.message;
      }
    }

    function switchTab(tabName) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('authAlert').style.display = 'none';

      if (tabName === 'login') {
        document.getElementById('panelLogin').classList.add('active');
        document.querySelector('.tab:nth-child(1)').classList.add('active');
        document.getElementById('authTabs').style.display = 'flex';
      } else if (tabName === 'cadastro') {
        document.getElementById('panelCadastro').classList.add('active');
        document.querySelector('.tab:nth-child(2)').classList.add('active');
        document.getElementById('authTabs').style.display = 'flex';
      } else {
        document.getElementById('panelForgot').classList.add('active');
        document.getElementById('authTabs').style.display = 'none';
      }
    }

    async function handleAuth(e, type) {
      e.preventDefault();
      const alert = document.getElementById('authAlert');
      alert.style.display = 'none';
      
      const btnId = type === 'login' ? 'btnLogin' : (type === 'signup' ? 'btnSignup' : 'btnForgot');
      const btn = document.getElementById(btnId);
      const originalText = btn.textContent;
      
      btn.disabled = true;
      btn.textContent = 'Processando...';

      try {
        if (type === 'login') {
          const email = document.getElementById('loginEmail').value;
          const pass = document.getElementById('loginPass').value;
          const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
          if (error) throw error;
          redirectUser(data.user.email);
        } 
        else if (type === 'signup') {
          const email = document.getElementById('cadEmail').value;
          const pass = document.getElementById('cadPass').value;
          const name = document.getElementById('cadName').value;
          const { data, error } = await sb.auth.signUp({ 
            email, 
            password: pass,
            options: { data: { full_name: name } }
          });
          if (error) throw error;
          alert.style.display = 'block';
          alert.className = 'alert error'; // Usando error style para sucesso informativo
          alert.style.color = '#16A34A';
          alert.style.backgroundColor = '#F0FDF4';
          alert.style.borderColor = '#BBF7D0';
          alert.textContent = 'Conta criada! Verifique seu e-mail para confirmar.';
        }
        else if (type === 'forgot') {
          const email = document.getElementById('forgotEmail').value;
          const { error } = await sb.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + '/reset'
          });
          if (error) throw error;
          alert.style.display = 'block';
          alert.className = 'alert error';
          alert.style.color = '#16A34A';
          alert.style.backgroundColor = '#F0FDF4';
          alert.textContent = 'Link de recuperação enviado para seu e-mail.';
        }
      } catch (err) {
        alert.style.display = 'block';
        alert.className = 'alert error';
        alert.textContent = err.message;
      } finally {
        btn.disabled = false;
        btn.textContent = originalText;
      }
    }

    function redirectUser(email) {
      const alert = document.getElementById('authAlert');
      alert.style.display = 'block';
      alert.className = 'alert error';
      alert.style.color = '#16A34A';
      alert.style.backgroundColor = '#F0FDF4';
      alert.textContent = 'Autenticado! Entrando no sistema...';
      
      setTimeout(() => {
        if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'cardapio.html';
        }
      }, 1000);
    }

    // Auto-login check
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) redirectUser(session.user.email);
    })();

  </script>
</body>
