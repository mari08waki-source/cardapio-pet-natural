<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Acesso — Hako Pet</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sage:       #124016;
      --sage-light: #1A5C20;
      --gold:       #D4AF37;
      --white:      #FFFFFF;
      --bg:         #F8FAFB;
      --text:       #0F172A;
      --muted:      #64748B;
      --error:      #EF4444;
      --border:     #E2E8F0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #F8FAFB 0%, #E2E8F0 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: var(--white); width: 100%; max-width: 420px;
      border-radius: 32px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
      padding: 40px; position: relative; overflow: hidden;
    }
    .login-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
      background: linear-gradient(90deg, var(--sage), var(--gold));
    }
    .brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 32px; }
    .brand-icon {
      width: 54px; height: 54px; background: var(--sage); border-radius: 16px;
      display: flex; align-items: center; justify-content: center; color: var(--gold);
      margin-bottom: 12px;
    }
    .brand-name { font-size: 22px; font-weight: 800; color: var(--sage); }
    .tabs { display: flex; gap: 8px; margin-bottom: 24px; background: #F1F5F9; padding: 6px; border-radius: 14px; }
    .tab {
      flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 600;
      color: var(--muted); cursor: pointer; border-radius: 10px; transition: all 0.2s;
    }
    .tab.active { background: white; color: var(--sage); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .field input {
      width: 100%; padding: 14px 18px; border: 1.5px solid var(--border); border-radius: 16px;
      font-size: 16px; outline: none; background: #F1F5F9; transition: all 0.2s;
    }
    .field input:focus { border-color: var(--sage); background: white; }
    .btn-primary {
      width: 100%; padding: 16px; background: var(--sage); color: white; border: none;
      border-radius: 18px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s;
    }
    .alert { padding: 12px 16px; border-radius: 12px; font-size: 13px; margin-bottom: 20px; display: none; font-weight: 500; border: 1px solid transparent; }
    .alert.error { background: #FEF2F2; color: var(--error); border-color: #FECACA; display: block; }
    .alert.success { background: #F0FDF4; color: #16A34A; border-color: #BBF7D0; display: block; }
    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
      </div>
      <div class="brand-name">Hako Pet</div>
    </div>

    <div class="tabs" id="authTabs">
      <div class="tab active" onclick="switchTab('login')">Entrar</div>
      <div class="tab" onclick="switchTab('cadastro')">Criar Conta</div>
    </div>

    <div class="alert" id="authAlert"></div>

    <div class="panel active" id="panelLogin">
      <form onsubmit="handleAuth(event, 'login')">
        <div class="field">
          <label>E-mail</label>
          <input type="email" id="loginEmail" placeholder="seu@email.com" required />
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="loginPass" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary" id="btnLogin">Acessar Painel</button>
        <div id="magicArea" style="display:none; margin-top:16px;">
          <button type="button" onclick="handleMagic()" class="btn-primary" style="background:var(--gold);color:var(--sage)">Link Mágico por E-mail</button>
        </div>
      </form>
    </div>

    <div class="panel" id="panelCadastro">
      <form onsubmit="handleAuth(event, 'signup')">
        <div class="field"><label>Nome</label><input type="text" id="cadName" required /></div>
        <div class="field"><label>E-mail</label><input type="email" id="cadEmail" required /></div>
        <div class="field"><label>Senha</label><input type="password" id="cadPass" required minlength="8" /></div>
        <button type="submit" class="btn-primary">Cadastrar</button>
      </form>
    </div>
  </div>

  <script>
    const sb = supabase.createClient('https://fzmqdevzdwluhasvxswi.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6bXFkZXZ6ZHdsdWhhc3Z4c3dpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMDE2OTksImV4cCI6MjA5MTY3NzY5OX0.l9b9BNlsHzo4c5zzJJ-6a3byK3N5D4OsuWm42mA5udI');
    const ADMIN = 'mari08waki@gmail.com';

    document.getElementById('loginEmail').addEventListener('input', e => {
      document.getElementById('magicArea').style.display = e.target.value.toLowerCase() === ADMIN ? 'block' : 'none';
    });

    function switchTab(t) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(tb => tb.classList.remove('active'));
      document.getElementById('panel' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('active');
      document.querySelector(`.tab:nth-child(${t === 'login' ? 1 : 2})`).classList.add('active');
    }

    async function handleAuth(e, type) {
      e.preventDefault();
      const alert = document.getElementById('authAlert');
      alert.style.display = 'none';
      try {
        if(type === 'login') {
          const { data, error } = await sb.auth.signInWithPassword({ email: document.getElementById('loginEmail').value, password: document.getElementById('loginPass').value });
          if(error) throw error;
          redirect(data.user.email);
        } else {
          const { error } = await sb.auth.signUp({ email: document.getElementById('cadEmail').value, password: document.getElementById('cadPass').value, options: { data: { full_name: document.getElementById('cadName').value } } });
          if(error) throw error;
          alert.className = 'alert success'; alert.textContent = 'Conta criada! Verifique seu e-mail.';
        }
      } catch(err) {
        alert.className = 'alert error'; alert.textContent = err.message;
      }
    }

    async function handleMagic() {
      const { error } = await sb.auth.signInWithOtp({ email: document.getElementById('loginEmail').value, options: { emailRedirectTo: window.location.origin + '/admin.html' } });
      const alert = document.getElementById('authAlert');
      if(error) { alert.className = 'alert error'; alert.textContent = error.message; }
      else { alert.className = 'alert success'; alert.textContent = 'Link enviado!'; }
    }

    function redirect(email) {
      window.location.href = email.toLowerCase() === ADMIN ? 'admin.html' : 'cardapio.html';
    }
  </script>
</body>
</html>
