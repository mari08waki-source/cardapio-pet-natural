<script>
  // DETECTOR DE REDIRECIONAMENTO MASTER
  (function() {
    const url = window.location.href;
    const hash = window.location.hash;
    
    // Se houver qualquer indício de recuperação de senha ou confirmação de conta
    if (url.includes('access_token') || hash.includes('access_token') || url.includes('type=recovery')) {
      console.log("Fluxo de Autenticação detectado. Redirecionando para RESET...");
      window.location.href = '/reset-senha.html' + hash;
      return;
    }

    // Se não for autenticação, aguarda um momento e vai para o Quiz

      window.location.href = 'calculadora-pet-FINAL.html';
    }, 500);
  })();
