<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#124016"/>
  <title>Redefinir Senha — Hako Pet</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --sage:       #124016;
      --sage-dark:  #0D2E10;
      --gold:       #D4AF37;
      --white:      #FFFFFF;
      --bg:         #F8FAFB;
      --text:       #0F172A;
      --muted:      #64748B;
      --border:     #E2E8F0;
      --error:      #EF4444;
      --success:    #10B981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #F8FAFB 0%, #E2E8F0 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--white);
      width: 100%;
      max-width: 420px;
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
      padding: 40px;
      position: relative;
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 54px; height: 54px;
      background: var(--sage);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      color: var(--gold);
      margin-bottom: 12px;
    }

    .brand-icon svg { width: 28px; height: 28px; }

    .title { font-size: 22px; font-weight: 800; color: var(--sage); text-align: center; }
    .sub { font-size: 14px; color: var(--muted); text-align: center; margin-top: 6px; margin-bottom: 32px; }

    .field { margin-bottom: 24px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .field input {
      width: 100%; padding: 14px 18px; border: 1.5px solid var(--border); border-radius: 16px;
      font-size: 16px; outline: none; background: #F1F5F9;
    }
    .field input:focus { border-color: var(--sage); background: white; }

    .btn {
      width: 100%; padding: 16px; background: var(--sage); color: white; border: none;
      border-radius: 18px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { background: var(--sage-dark); transform: translateY(-2px); }

    .alert { padding: 12px; border-radius: 12px; font-size: 14px; margin-bottom: 24px; display: none; font-weight: 600; text-align: center; }
    .alert.error { background: #FEF2F2; color: var(--error); border: 1px solid #FECACA; display: block; }
    .alert.success { background: #ECFDF5; color: var(--success); border: 1px solid #A7F3D0; display: block; }

  </style>

<body>

  <div class="card">
    <div class="brand">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
      </div>
      <h1 class="title">Nova Senha</h1>
      <p class="sub">Crie uma senha forte para proteger seu acesso mestre.</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form onsubmit="handleReset(event)">
      <div class="field">
        <label>Digite a nova senha</label>
        <input type="password" id="newPass" placeholder="••••••••" required minlength="8" />
      </div>
      <button type="submit" class="btn" id="btnAction">Redefinir e Entrar</button>
    </form>
  </div>

  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://fzmqdevzdwluhasvxswi.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ6bXFkZXZ6ZHdsdWhhc3Z4c3dpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxMDE2OTksImV4cCI6MjA5MTY3NzY5OX0.l9b9BNlsHzo4c5zzJJ-6a3byK3N5D4OsuWm42mA5udI'
    );

    async function handleReset(e) {
      e.preventDefault();
      const alert = document.getElementById('alertBox');
      const btn = document.getElementById('btnAction');
      const pass = document.getElementById('newPass').value;

      alert.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Atualizando...';

      try {
        const { error } = await sb.auth.updateUser({ password: pass });
        if (error) throw error;

        alert.className = 'alert success';
        alert.textContent = 'Senha atualizada! Redirecionando...';
        setTimeout(() => { window.location.href = '/login'; }, 2000);
      } catch (err) {
        alert.className = 'alert error';
        alert.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Redefinir e Entrar';
      }
    }
  </script>
</body>
